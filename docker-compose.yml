# A fixed network name (not derived from the clone folder), so scripts/mcp-grafana.mjs can join
# it and reach Grafana as http://grafana:3000 on Windows, macOS and Linux alike.
networks:
  default:
    name: rag-implementation

services:
  neo4j:
    image: neo4j:5.26.31-community
    container_name: rag-implementation-neo4j
    # Published on the loopback interface only: the browser console and the Bolt port are not
    # reachable from other machines on the network.
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    environment:
      # The password comes from .env (NEO4J_PASSWORD); no password literal lives in this file.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD (8+ characters) in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ./.neo4j-data/data:/data
      - ./.neo4j-data/logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Observability stack (npm run obs:up). Not started by npm run db:up.
  loki:
    image: grafana/loki:3.7.9
    container_name: rag-implementation-loki
    profiles: ['observability']
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./ops/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./.loki-data:/loki
    mem_limit: 512m
    # The image is distroless (no shell, no wget), so there is no container healthcheck;
    # npm run obs:up polls http://127.0.0.1:3100/ready from the host instead.

  grafana:
    image: grafana/grafana:13.3.0
    container_name: rag-implementation-grafana
    profiles: ['observability']
    depends_on:
      loki:
        condition: service_started
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env; npm run obs:up refuses to start without it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.grafana-data:/var/lib/grafana
    # Grafana 13 idles around 270 MB; 512 MB leaves room for dashboard queries.
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
      # Grafana took ~4 min to start with 0.5 GB of host RAM free (2026-11-06); --wait must not give up first.
      start_period: 180s
