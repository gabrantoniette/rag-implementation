services:
  neo4j:
    image: neo4j:5.26.31-community
    container_name: rag-implementation-neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      # The password comes from .env (NEO4J_PASSWORD); no password literal lives in this file.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD (8+ characters) in .env}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ./.neo4j-data/data:/data
      - ./.neo4j-data/logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
